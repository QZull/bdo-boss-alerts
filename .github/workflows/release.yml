name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build portable exe
        run: npx electron-vite build; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npx electron-builder --win portable --publish never

      - name: Name asset by tag
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          Copy-Item dist/Resp-bossov.exe "dist/Resp-bossov-$ver.exe"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: dist/Resp-bossov-*.exe
